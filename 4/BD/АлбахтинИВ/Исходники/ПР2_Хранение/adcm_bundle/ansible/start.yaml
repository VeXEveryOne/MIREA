---
- name: Confirm educational ADPG laboratory services are running
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Verify running PostgreSQL endpoint
      ansible.builtin.wait_for:
        host: adpg
        port: 5432
        timeout: 20
    - name: Verify running Prometheus
      ansible.builtin.uri:
        url: http://prometheus:9090/-/ready
        status_code: 200
    - name: Verify running Grafana
      ansible.builtin.uri:
        url: http://grafana:3000/api/health
        return_content: true
        status_code: 200
