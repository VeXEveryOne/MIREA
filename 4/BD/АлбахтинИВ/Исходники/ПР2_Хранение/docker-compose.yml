services:
  adcm-db:
    image: postgres:16
    container_name: adcm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: adcm_user
      POSTGRES_PASSWORD: ${TIABD_ADCM_DB_PASSWORD:?Set TIABD_ADCM_DB_PASSWORD in .env}
      POSTGRES_DB: adcm_db
    volumes:
      - adcm-db-data:/var/lib/postgresql/data
    networks: [tiabd]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adcm_user -d adcm_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  adcm:
    image: hub.arenadata.io/adcm/adcm:2.12.0
    container_name: adcm
    restart: unless-stopped
    depends_on:
      adcm-db:
        condition: service_healthy
    environment:
      DB_HOST: adcm-db
      DB_PORT: 5432
      DB_NAME: adcm_db
      DB_USER: adcm_user
      DB_PASS: ${TIABD_ADCM_DB_PASSWORD:?Set TIABD_ADCM_DB_PASSWORD in .env}
    ports:
      - "8000:8000"
    volumes:
      - adcm-data:/adcm/data
    networks: [tiabd]

networks:
  tiabd:
    name: adcm-net

volumes:
  adcm-db-data:
  adcm-data:
