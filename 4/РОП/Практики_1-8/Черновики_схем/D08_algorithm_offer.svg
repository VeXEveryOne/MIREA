ormal" text-anchor="middle" fill="#111">потребовать ручное решение</text><rect x="405" y="725" width="470" height="105" rx="0" fill="white" stroke="#222" stroke-width="2"/><text x="640.0" y="771.4" font-family="Arial" font-size="20" font-weight="normal" text-anchor="middle" fill="#111">Сортировать: приоритет поставщика,</text><text x="640.0" y="796.4" font-family="Arial" font-size="20" font-weight="normal" text-anchor="middle" fill="#111">цена, время, идентификатор</text><polygon points="452,920 850,920 828,1015 430,1015" fill="white" stroke="#222" stroke-width="2"/><text x="640.0" y="961.4" font-family="Arial" font-size="20" font-weight="normal" text-anchor="middle" fill="#111">Сохранить offer_id</text><text x="640.0" y="986.4" font-family="Arial" font-size="20" font-weight="normal" text-anchor="middle" fill="#111">и разрешённый компонент</text><polyline points="635.0,80.0 635.0,107.5 635.0,107.5 635.0,135.0" fill="none" stroke="#333" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="635.0,230.0 635.0,267.5 635.0,267.5 635.0,305.0" fill="none" stroke="#333" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="635.0,405.0 635.0,445.0 635.0,445.0 635.0,485.0" fill="none" stroke="#333" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="415.0,560.0 380.0,560.0 380.0,557.5 345.0,557.5" fill="none" stroke="#333" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="378.2" y="531.75" width="27.599999999999998" height="24" fill="white"/><text x="392.0" y="550.75" font-family="Arial" font-size="17" font-weight="normal" text-anchor="middle" fill="#111">Нет</text><polyline points="635.0,635.0 635.0,680.0 640.0,680.0 640.0,725.0" fill="none" stroke="#333" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="640.3" y="653.0" width="18.4" height="24" fill="white"/><text x="649.5" y="672.0" font-family="Arial" font-size="17" font-weight="normal" text-anchor="middle" fill="#111">Да</text><polyline points="640.0,830.0 640.0,875.0 640.0,875.0