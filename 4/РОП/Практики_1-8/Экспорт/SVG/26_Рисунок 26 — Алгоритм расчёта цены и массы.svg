t x="640" y="168.10000000000002" text-anchor="middle" font-family="Arial" font-size="28">Модельный ряд, выбранные</text><text x="640" y="200.3" text-anchor="middle" font-family="Arial" font-size="28">предложения</text><text x="640" y="232.5" text-anchor="middle" font-family="Arial" font-size="28">и версия правил</text><path d="M640 290L860 375L640 460L420 375Z" fill="white" stroke="#111" stroke-width="2"/><text x="640" y="335.7" text-anchor="middle" font-family="Arial" font-size="28">Все слоты</text><text x="640" y="367.9" text-anchor="middle" font-family="Arial" font-size="28">разрешены,</text><text x="640" y="400.1" text-anchor="middle" font-family="Arial" font-size="28">цены свежие и</text><text x="640" y="432.3" text-anchor="middle" font-family="Arial" font-size="28">масса &gt; 0?</text><path d="M50 315H340L320 420H30Z" fill="white" stroke="#111" stroke-width="2"/><text x="185" y="360.4" text-anchor="middle" font-family="Arial" font-size="28">Выдать причины</text><text x="185" y="392.6" text-anchor="middle" font-family="Arial" font-size="28">расчёт не сохранять</text><rect x="400" y="530" width="480" height="105" rx="0" fill="white" stroke="#111" stroke-width="2"/><text x="640" y="575.4" text-anchor="middle" font-family="Arial" font-size="28">C = Σ qᵢpᵢ + A + U</text><text x="640" y="607.6" text-anchor="middle" font-family="Arial" font-size="28">W = wкорпуса + Σ qᵢwᵢ + wуп</text><rect x="400" y="705" width="480" height="105" rx="0" fill="white" stroke="#111" stroke-width="2"/><text x="640" y="750.4" text-anchor="middle" font-family="Arial" font-size="28">P = ceil(C(1 + m)/s) × s</text><text x="640" y="782.6" text-anchor="middle" font-family="Arial" font-size="28">округлить массу до 0,001 кг</text><path d="M420 885H880L860 990H400Z" fill="white" stroke="#111" stroke-width="2"/><text x="640" y="930.4" text-anchor="middle" font-family="Arial" font-size="28">Сохранить расчёт и снимок</text><text x="640" y="962.6" text-anchor="middle" font-family="Arial" font-size="28">цен, состава и правил</text><rect x="85" y="480" width="200" height="60" rx="24" fill="white" stroke="#111" stroke-width="2"/><text x="185" y="519" text-anchor="middle" font-family="Arial" font-size="28">Конец</text><rect x="540" y="1050" width="200" height="60" rx="24" fill="white" stroke="#111" stroke-width="2"/><text x="640" y="1089" text-anchor="middle" font-family="Arial" font-size="28">Конец</text><rect x="363" y="357" width="54" height="36" fill="white"/><text x="369" y="384" font-family="Arial" font-size="26">Нет</text><rect x="618.5" y="477" width="43" height="36" fill="white"/><text x="624.5" y="504" font-family="Arial" font-size="26">Да</text></svg>