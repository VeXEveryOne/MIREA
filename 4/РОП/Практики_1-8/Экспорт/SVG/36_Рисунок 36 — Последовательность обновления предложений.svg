<svg xmlns="http://www.w3.org/2000/svg" width="1855" height="2014" viewBox="0 0 1855 2014"><defs><marker id="call" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111"/></marker><marker id="open" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="80" y="40" width="245" height="82" fill="white" stroke="#111" stroke-width="1.7"/><text x="202.5" y="91.5" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="202.5" dy="0">Сотрудник склада</tspan></text><path d="M202.5 122V1999" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="370" y="40" width="245" height="82" fill="white" stroke="#111" stroke-width="1.7"/><text x="492.5" y="91.5" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="492.5" dy="0">Web / API</tspan></text><path d="M492.5 122V1999" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="660" y="40" width="245" height="82" fill="white" stroke="#111" stroke-width="1.7"/><text x="782.5" y="76" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="782.5" dy="0">Сервис</tspan><tspan x="782.5" dy="31">предложений</tspan></text><path d="M782.5 122V1999" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="950" y="40" width="245" height="82" fill="white" stroke="#111" stroke-width="1.7"/><text x="1072.5" y="91.5" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1072.5" dy="0">Адаптер</tspan></text><path d="M1072.5 122V1999" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="1240" y="40" width="245" height="82" fill="white" stroke="#111" stroke-width="1.7"/><text x="1362.5" y="91.5" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1362.5" dy="0">Поставщик</tspan></text><path d="M1362.5 122V1999" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="1530" y="40" width="245" height="82" fill="white" stroke="#111" stroke-width="1.7"/><text x="1652.5" y="91.5" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1652.5" dy="0">PostgreSQL</tspan></text><path d="M1652.5 122V1999" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="24" y="531" width="1807" height="1448" fill="none" stroke="#111" stroke-width="1.4"/><rect x="46" y="787" width="1763" height="1192" fill="none" stroke="#111" stroke-width="1.4"/><rect x="68" y="1074" width="1719" height="309" fill="none" stroke="#111" stroke-width="1.4"/><rect x="213" y="161" width="269" height="124" fill="white"/><text x="347.5" y="187" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="347.5" dy="0">1. Обновить</tspan><tspan x="347.5" dy="31">выбранного</tspan><tspan x="347.5" dy="31">поставщика; HTTPS /</tspan><tspan x="347.5" dy="31">JSON</tspan></text><path d="M202.5 299H492.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="520" y="315" width="235" height="93" fill="white"/><text x="637.5" y="341" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="637.5" dy="0">2. Проверить роль</tspan><tspan x="637.5" dy="31">STOCK; начать</tspan><tspan x="637.5" dy="31">импорт</tspan></text><path d="M492.5 422H782.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#open)"/><rect x="221.5" y="438" width="252" height="62" fill="white"/><text x="347.5" y="464" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="347.5" dy="0">3. Импорт принят в</tspan><tspan x="347.5" dy="31">фоновую обработку</tspan></text><path d="M492.5 514H202.5" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="40" y="530" width="1775" height="37" fill="white"/><text x="50" y="556" font-family="Arial" font-size="24" text-anchor="start"><tspan x="50" dy="0">loop · Первая попытка и до 3 отложенных повторов [не завершено и попытка ≤ 4; дождаться next_attempt_at / срока сервера]</tspan></text><rect x="797" y="571" width="261" height="62" fill="white"/><text x="927.5" y="597" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="927.5" dy="0">4. Запросить свежие</tspan><tspan x="927.5" dy="31">предложения</tspan></text><path d="M782.5 647H1072.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="1120.5" y="663" width="194" height="93" fill="white"/><text x="1217.5" y="689" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">5. HTTPS;</tspan><tspan x="1217.5" dy="31">согласованный</tspan><tspan x="1217.5" dy="31">JSON/файл</tspan></text><path d="M1072.5 770H1362.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="62" y="786" width="1731" height="37" fill="white"/><text x="72" y="812" font-family="Arial" font-size="24" text-anchor="start"><tspan x="72" dy="0">alt · Результат получения предложений [получены данные]</tspan></text><rect x="1100.5" y="827" width="234" height="93" fill="white"/><text x="1217.5" y="853" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">6. Ответ с ценами,</tspan><tspan x="1217.5" dy="31">остатками и</tspan><tspan x="1217.5" dy="31">временем</tspan></text><path d="M1362.5 934H1072.5" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="814.5" y="950" width="226" height="93" fill="white"/><text x="927.5" y="976" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="927.5" dy="0">7. Проверенные</tspan><tspan x="927.5" dy="31">записи и</tspan><tspan x="927.5" dy="31">неизвестные SKU</tspan></text><path d="M1072.5 1057H782.5" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="84" y="1073" width="1687" height="37" fill="white"/><text x="94" y="1099" font-family="Arial" font-size="24" text-anchor="start"><tspan x="94" dy="0">alt · Валидация полученных записей [есть корректные сопоставленные записи]</tspan></text><rect x="934" y="1114" width="567" height="31" fill="white"/><text x="1217.5" y="1140" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">8. Транзакция: добавить снимки предложений</tspan></text><path d="M782.5 1159H1652.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="971" y="1175" width="493" height="31" fill="white"/><text x="1217.5" y="1201" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">9. Зависимые карточки → STALE; аудит</tspan></text><path d="M782.5 1220H1652.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><path d="M68 1237H1787" stroke="#111" stroke-width="1.4" stroke-dasharray="8 5"/><rect x="84" y="1236" width="1687" height="37" fill="white"/><text x="94" y="1262" font-family="Arial" font-size="24" text-anchor="start"><tspan x="94" dy="0">alt · Валидация полученных записей [else]</tspan></text><rect x="802.5" y="1277" width="830" height="62" fill="white"/><text x="1217.5" y="1303" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">10. Не принимать неверные записи; сохранить причины и прежнюю</tspan><tspan x="1217.5" dy="31">дату</tspan></text><path d="M782.5 1353H1652.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="504.5" y="1369" width="266" height="62" fill="white"/><text x="637.5" y="1395" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="637.5" dy="0">11. Сводка: принято /</tspan><tspan x="637.5" dy="31">отклонено</tspan></text><path d="M782.5 1445H492.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="224.5" y="1461" width="246" height="93" fill="white"/><text x="347.5" y="1487" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="347.5" dy="0">12. Показать дату и</tspan><tspan x="347.5" dy="31">ошибки</tspan><tspan x="347.5" dy="31">сопоставления</tspan></text><path d="M492.5 1568H202.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><path d="M46 1585H1809" stroke="#111" stroke-width="1.4" stroke-dasharray="8 5"/><rect x="62" y="1584" width="1731" height="37" fill="white"/><text x="72" y="1610" font-family="Arial" font-size="24" text-anchor="start"><tspan x="72" dy="0">alt · Результат получения предложений [тайм-аут либо 429 либо 5xx]</tspan></text><rect x="806.5" y="1625" width="242" height="93" fill="white"/><text x="927.5" y="1651" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="927.5" dy="0">13. Тайм-аут / 429 /</tspan><tspan x="927.5" dy="31">5xx: отложенный</tspan><tspan x="927.5" dy="31">повтор</tspan></text><path d="M1072.5 1732H782.5" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="501.5" y="1748" width="272" height="93" fill="white"/><text x="637.5" y="1774" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="637.5" dy="0">14. Старые данные</tspan><tspan x="637.5" dy="31">сохранены с прежней</tspan><tspan x="637.5" dy="31">датой</tspan></text><path d="M782.5 1855H492.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="790" y="1871" width="855" height="62" fill="white"/><text x="1217.5" y="1897" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">15. Записать retry_count, next_attempt_at и причину; после 3 повторов</tspan><tspan x="1217.5" dy="31">завершить с ошибкой</tspan></text><path d="M782.5 1947H1652.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/></svg>