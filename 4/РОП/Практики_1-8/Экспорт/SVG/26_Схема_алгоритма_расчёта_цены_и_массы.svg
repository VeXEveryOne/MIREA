<svg xmlns="http://www.w3.org/2000/svg" width="1025" height="1235" viewBox="-20 -20 1025 1235"><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111"/></marker></defs><rect x="-20" y="-20" width="1025" height="1235" fill="white"/><path d="M640 80L640 135" fill="none" stroke="white" stroke-width="7"/><path d="M640 80L640 135" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 280L640 355" fill="none" stroke="white" stroke-width="7"/><path d="M640 280L640 355" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/><path d="M420 440L340 440" fill="none" stroke="white" stroke-width="7"/><path d="M420 440L340 440" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 525L640 595" fill="none" stroke="white" stroke-width="7"/><path d="M640 525L640 595" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 739.8L640 770" fill="none" stroke="white" stroke-width="7"/><path d="M640 739.8L640 770" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 875L640 950" fill="none" stroke="white" stroke-width="7"/><path d="M640 875L640 950" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/><path d="M185 492.5L185 545" fill="none" stroke="white" stroke-width="7"/><path d="M185 492.5L185 545" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 1055L640 1115" fill="none" stroke="white" stroke-width="7"/><path d="M640 1055L640 1115" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/><rect x="465" y="20" width="350" height="60" rx="24" fill="white" stroke="#111" stroke-width="2"/><text x="640" y="59" text-anchor="middle" font-family="Arial" font-size="28">Начало</text><path d="M335 135H965L945 280H315Z" fill="white" stroke="#111" stroke-width="2"/><text x="640" y="184.3" text-anchor="middle" font-family="Arial" font-size="28">Версия состава; цены pᵢ; количества qᵢ; массы</text><text x="640" y="216.5" text-anchor="middle" font-family="Arial" font-size="28">wcase, wᵢ, wpack; сборка A; упаковка U;</text><text x="640" y="248.7" text-anchor="middle" font-family="Arial" font-size="28">наценка m; шаг s</text><path d="M640 355L860 440L640 525L420 440Z" fill="white" stroke="#111" stroke-width="2"/><text x="640" y="416.8" text-anchor="middle" font-family="Arial" font-size="28">Состав полный,</text><text x="640" y="449" text-anchor="middle" font-family="Arial" font-size="28">цены актуальны,</text><text x="640" y="481.2" text-anchor="middle" font-family="Arial" font-size="28">массы &gt; 0?</text><path d="M50 387.5H340L320 492.5H30Z" fill="white" stroke="#111" stroke-width="2"/><text x="185" y="432.9" text-anchor="middle" font-family="Arial" font-size="28">Выдать причины</text><text x="185" y="465.1" text-anchor="middle" font-family="Arial" font-size="28">расчёт не сохранять</text><rect x="400" y="595" width="480" height="144.8" rx="0" fill="white" stroke="#111" stroke-width="2"/><text x="640" y="628.1" text-anchor="middle" font-family="Arial" font-size="28">Ccomp = цена корпуса + Σ qᵢpᵢ</text><text x="640" y="660.3" text-anchor="middle" font-family="Arial" font-size="28">C = Ccomp + A + U</text><text x="640" y="692.5" text-anchor="middle" font-family="Arial" font-size="28">Масса с упаковкой:</text><text x="640" y="724.6999999999999" text-anchor="middle" font-family="Arial" font-size="28">W = wcase + Σ qᵢwᵢ + wpack</text><rect x="400" y="770" width="480" height="105" rx="0" fill="white" stroke="#111" stroke-width="2"/><text x="640" y="815.4" text-anchor="middle" font-family="Arial" font-size="28">P = ceil(C(1 + m)/s) × s</text><text x="640" y="847.6" text-anchor="middle" font-family="Arial" font-size="28">округлить массу до 0,001 кг</text><path d="M420 950H880L860 1055H400Z" fill="white" stroke="#111" stroke-width="2"/><text x="640" y="995.4" text-anchor="middle" font-family="Arial" font-size="28">Сохранить расчёт и снимок</text><text x="640" y="1027.6" text-anchor="middle" font-family="Arial" font-size="28">цен, состава и правил</text><rect x="85" y="545" width="200" height="60" rx="24" fill="white" stroke="#111" stroke-width="2"/><text x="185" y="584" text-anchor="middle" font-family="Arial" font-size="28">Конец</text><rect x="540" y="1115" width="200" height="60" rx="24" fill="white" stroke="#111" stroke-width="2"/><text x="640" y="1154" text-anchor="middle" font-family="Arial" font-size="28">Конец</text><rect x="353" y="392" width="54" height="36" fill="white"/><text x="359" y="419" font-family="Arial" font-size="26">Нет</text><rect x="588.5" y="542" width="43" height="36" fill="white"/><text x="594.5" y="569" font-family="Arial" font-size="26">Да</text></svg>