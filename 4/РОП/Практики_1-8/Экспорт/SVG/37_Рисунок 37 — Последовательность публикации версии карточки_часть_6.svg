N:</tspan><tspan x="927.5" dy="31">сохранить тот же</tspan><tspan x="927.5" dy="31">operation_key и</tspan><tspan x="927.5" dy="31">снимок запроса</tspan></text><path d="M1072.5 621H782.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="1084" y="637" width="267" height="155" fill="white"/><text x="1217.5" y="663" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">19. Сверить по</tspan><tspan x="1217.5" dy="31">внешнему ID или</tspan><tspan x="1217.5" dy="31">стабильному offer_id;</tspan><tspan x="1217.5" dy="31">не повторять</tspan><tspan x="1217.5" dy="31">отправку вслепую</tspan></text><path d="M1072.5 806H1362.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/></svg>