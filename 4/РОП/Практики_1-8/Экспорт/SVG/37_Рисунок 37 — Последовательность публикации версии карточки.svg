<svg xmlns="http://www.w3.org/2000/svg" width="1565" height="3436" viewBox="0 0 1565 3436"><defs><marker id="call" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111"/></marker><marker id="open" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="80" y="40" width="245" height="82" fill="white" stroke="#111" stroke-width="1.7"/><text x="202.5" y="91.5" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="202.5" dy="0">Менеджер</tspan></text><path d="M202.5 122V3421" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="370" y="40" width="245" height="82" fill="white" stroke="#111" stroke-width="1.7"/><text x="492.5" y="91.5" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="492.5" dy="0">Web / API</tspan></text><path d="M492.5 122V3421" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="660" y="40" width="245" height="82" fill="white" stroke="#111" stroke-width="1.7"/><text x="782.5" y="91.5" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="782.5" dy="0">PostgreSQL</tspan></text><path d="M782.5 122V3421" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="950" y="40" width="245" height="82" fill="white" stroke="#111" stroke-width="1.7"/><text x="1072.5" y="76" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1072.5" dy="0">Worker / адаптер</tspan><tspan x="1072.5" dy="31">Ozon</tspan></text><path d="M1072.5 122V3421" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="1240" y="40" width="245" height="82" fill="white" stroke="#111" stroke-width="1.7"/><text x="1362.5" y="91.5" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1362.5" dy="0">Ozon</tspan></text><path d="M1362.5 122V3421" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="8 6"/><rect x="24" y="715" width="1517" height="2686" fill="none" stroke="#111" stroke-width="1.4"/><rect x="46" y="951" width="1473" height="2450" fill="none" stroke="#111" stroke-width="1.4"/><rect x="68" y="1115" width="1429" height="2286" fill="none" stroke="#111" stroke-width="1.4"/><rect x="90" y="1402" width="1385" height="853" fill="none" stroke="#111" stroke-width="1.4"/><rect x="112" y="1566" width="1341" height="689" fill="none" stroke="#111" stroke-width="1.4"/><rect x="210.5" y="161" width="274" height="93" fill="white"/><text x="347.5" y="187" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="347.5" dy="0">1. Утвердить</tspan><tspan x="347.5" dy="31">card_version; HTTPS /</tspan><tspan x="347.5" dy="31">JSON</tspan></text><path d="M202.5 268H492.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="504" y="284" width="267" height="93" fill="white"/><text x="637.5" y="310" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="637.5" dy="0">2. Проверки и запись</tspan><tspan x="637.5" dy="31">QUEUED +</tspan><tspan x="637.5" dy="31">operation_key</tspan></text><path d="M492.5 391H782.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="210" y="407" width="275" height="62" fill="white"/><text x="347.5" y="433" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="347.5" dy="0">3. Принято в очередь;</tspan><tspan x="347.5" dy="31">локальный ID</tspan></text><path d="M492.5 483H202.5" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="532.5" y="499" width="500" height="62" fill="white"/><text x="782.5" y="525" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="782.5" dy="0">4. Уведомление о доступной очереди;</tspan><tspan x="782.5" dy="31">обработка независимо от HTTP-запроса</tspan></text><path d="M492.5 575H1072.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="791.5" y="591" width="272" height="93" fill="white"/><text x="927.5" y="617" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="927.5" dy="0">5. Захватить</tspan><tspan x="927.5" dy="31">операцию, проверить</tspan><tspan x="927.5" dy="31">версию</tspan></text><path d="M1072.5 698H782.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="40" y="714" width="1485" height="37" fill="white"/><text x="50" y="740" font-family="Arial" font-size="24" text-anchor="start"><tspan x="50" dy="0">alt · Проверка перед отправкой [else]</tspan></text><rect x="796.5" y="755" width="262" height="124" fill="white"/><text x="927.5" y="781" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="927.5" dy="0">6. Не отправлять</tspan><tspan x="927.5" dy="31">устаревшую версию;</tspan><tspan x="927.5" dy="31">аудит и требование</tspan><tspan x="927.5" dy="31">нового утверждения</tspan></text><path d="M1072.5 893H782.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><path d="M24 910H1541" stroke="#111" stroke-width="1.4" stroke-dasharray="8 5"/><rect x="40" y="909" width="1485" height="37" fill="white"/><text x="50" y="935" font-family="Arial" font-size="24" text-anchor="start"><tspan x="50" dy="0">alt · Проверка перед отправкой [версия актуальна и утверждена]</tspan></text><rect x="62" y="950" width="1441" height="37" fill="white"/><text x="72" y="976" font-family="Arial" font-size="24" text-anchor="start"><tspan x="72" dy="0">loop · Ограниченные безопасные повторы [операция не завершена; автоматический повтор разрешён; попытка ≤ 4]</tspan></text><rect x="1103" y="991" width="229" height="93" fill="white"/><text x="1217.5" y="1017" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">7. Отправить</tspan><tspan x="1217.5" dy="31">карточку; HTTPS /</tspan><tspan x="1217.5" dy="31">JSON</tspan></text><path d="M1072.5 1098H1362.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="84" y="1114" width="1397" height="37" fill="white"/><text x="94" y="1140" font-family="Arial" font-size="24" text-anchor="start"><tspan x="94" dy="0">alt · Исход отправки [получен ответ с ID задачи]</tspan></text><rect x="1102" y="1155" width="231" height="93" fill="white"/><text x="1217.5" y="1181" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">8. Идентификатор</tspan><tspan x="1217.5" dy="31">задачи / текущий</tspan><tspan x="1217.5" dy="31">результат</tspan></text><path d="M1362.5 1262H1072.5" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="841.5" y="1278" width="172" height="93" fill="white"/><text x="927.5" y="1304" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="927.5" dy="0">9. Сохранить</tspan><tspan x="927.5" dy="31">внешний ID и</tspan><tspan x="927.5" dy="31">WAITING</tspan></text><path d="M1072.5 1385H782.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="106" y="1401" width="1353" height="37" fill="white"/><text x="116" y="1427" font-family="Arial" font-size="24" text-anchor="start"><tspan x="116" dy="0">loop · Ожидание обработки по известному ID [статус WAITING; наступил срок проверки]</tspan></text><rect x="1126" y="1442" width="183" height="93" fill="white"/><text x="1217.5" y="1468" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">10. Запросить</tspan><tspan x="1217.5" dy="31">результат по</tspan><tspan x="1217.5" dy="31">известному ID</tspan></text><path d="M1072.5 1549H1362.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="128" y="1565" width="1309" height="37" fill="white"/><text x="138" y="1591" font-family="Arial" font-size="24" text-anchor="start"><tspan x="138" dy="0">alt · Ответ на проверку статуса [ещё обрабатывается]</tspan></text><rect x="1085" y="1606" width="265" height="62" fill="white"/><text x="1217.5" y="1632" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">11. WAITING: задача</tspan><tspan x="1217.5" dy="31">ещё обрабатывается</tspan></text><path d="M1362.5 1682H1072.5" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 5" marker-end="url(#open)"/><path d="M112 1699H1453" stroke="#111" stroke-width="1.4" stroke-dasharray="8 5"/><rect x="128" y="1698" width="1309" height="37" fill="white"/><text x="138" y="1724" font-family="Arial" font-size="24" text-anchor="start"><tspan x="138" dy="0">alt · Ответ на проверку статуса [успешно]</tspan></text><rect x="1079.5" y="1739" width="276" height="62" fill="white"/><text x="1217.5" y="1765" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">12. Успех: внешний ID</tspan><tspan x="1217.5" dy="31">товара</tspan></text><path d="M1362.5 1815H1072.5" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="835.5" y="1831" width="184" height="93" fill="white"/><text x="927.5" y="1857" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="927.5" dy="0">13. SUCCESS,</tspan><tspan x="927.5" dy="31">PUBLISHED и</tspan><tspan x="927.5" dy="31">уведомление</tspan></text><path d="M1072.5 1938H782.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><path d="M112 1955H1453" stroke="#111" stroke-width="1.4" stroke-dasharray="8 5"/><rect x="128" y="1954" width="1309" height="37" fill="white"/><text x="138" y="1980" font-family="Arial" font-size="24" text-anchor="start"><tspan x="138" dy="0">alt · Ответ на проверку статуса [ошибка обработки]</tspan></text><rect x="1090.5" y="1995" width="254" height="93" fill="white"/><text x="1217.5" y="2021" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">14. Ошибка</tspan><tspan x="1217.5" dy="31">обработки: причины</tspan><tspan x="1217.5" dy="31">отклонения</tspan></text><path d="M1362.5 2102H1072.5" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 5" marker-end="url(#open)"/><rect x="805" y="2118" width="245" height="93" fill="white"/><text x="927.5" y="2144" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="927.5" dy="0">15. Постоянная</tspan><tspan x="927.5" dy="31">ошибка: FAILED;</tspan><tspan x="927.5" dy="31">сохранить причины</tspan></text><path d="M1072.5 2225H782.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><path d="M68 2242H1497" stroke="#111" stroke-width="1.4" stroke-dasharray="8 5"/><rect x="84" y="2241" width="1397" height="37" fill="white"/><text x="94" y="2267" font-family="Arial" font-size="24" text-anchor="start"><tspan x="94" dy="0">alt · Исход отправки [временный отказ / 429 / 5xx без неизвестного исхода]</tspan></text><rect x="796.5" y="2282" width="262" height="186" fill="white"/><text x="927.5" y="2308" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="927.5" dy="0">16. RETRY: не более</tspan><tspan x="927.5" dy="31">3 повторов;</tspan><tspan x="927.5" dy="31">сохранить причину и</tspan><tspan x="927.5" dy="31">next_attempt_at;</tspan><tspan x="927.5" dy="31">соблюдать срок</tspan><tspan x="927.5" dy="31">сервера</tspan></text><path d="M1072.5 2482H782.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="1121.5" y="2498" width="396" height="93" fill="white"/><text x="1127.5" y="2524" font-family="Arial" font-size="26" text-anchor="start"><tspan x="1127.5" dy="0">17. Ожидать next_attempt_at, не</tspan><tspan x="1127.5" dy="31">блокируя пользовательский</tspan><tspan x="1127.5" dy="31">запрос</tspan></text><path d="M1072.5 2605H1114.5V2637H1072.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><path d="M68 2657H1497" stroke="#111" stroke-width="1.4" stroke-dasharray="8 5"/><rect x="84" y="2656" width="1397" height="37" fill="white"/><text x="94" y="2682" font-family="Arial" font-size="24" text-anchor="start"><tspan x="94" dy="0">alt · Исход отправки [ответ потерян и результат отправки неизвестен]</tspan></text><rect x="818.5" y="2697" width="218" height="124" fill="white"/><text x="927.5" y="2723" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="927.5" dy="0">18. UNCERTAIN:</tspan><tspan x="927.5" dy="31">сохранить тот же</tspan><tspan x="927.5" dy="31">operation_key и</tspan><tspan x="927.5" dy="31">снимок запроса</tspan></text><path d="M1072.5 2835H782.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="1084" y="2851" width="267" height="155" fill="white"/><text x="1217.5" y="2877" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="1217.5" dy="0">19. Сверить по</tspan><tspan x="1217.5" dy="31">внешнему ID или</tspan><tspan x="1217.5" dy="31">стабильному offer_id;</tspan><tspan x="1217.5" dy="31">не повторять</tspan><tspan x="1217.5" dy="31">отправку вслепую</tspan></text><path d="M1072.5 3020H1362.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><rect x="797.5" y="3036" width="260" height="155" fill="white"/><text x="927.5" y="3062" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="927.5" dy="0">20. Если сверка</tspan><tspan x="927.5" dy="31">неоднозначна —</tspan><tspan x="927.5" dy="31">прекратить</tspan><tspan x="927.5" dy="31">автоповторы до</tspan><tspan x="927.5" dy="31">решения сотрудника</tspan></text><path d="M1072.5 3205H782.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/><path d="M68 3222H1497" stroke="#111" stroke-width="1.4" stroke-dasharray="8 5"/><rect x="84" y="3221" width="1397" height="37" fill="white"/><text x="94" y="3247" font-family="Arial" font-size="24" text-anchor="start"><tspan x="94" dy="0">alt · Исход отправки [постоянная ошибка обязательных атрибутов]</tspan></text><rect x="805" y="3262" width="245" height="93" fill="white"/><text x="927.5" y="3288" font-family="Arial" font-size="26" text-anchor="middle"><tspan x="927.5" dy="0">21. Постоянная</tspan><tspan x="927.5" dy="31">ошибка: FAILED;</tspan><tspan x="927.5" dy="31">сохранить причины</tspan></text><path d="M1072.5 3369H782.5" fill="none" stroke="#111" stroke-width="1.8"  marker-end="url(#call)"/></svg>