<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1030" viewBox="0 0 1800 1030"><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#111"/></marker><marker id="solid" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#111"/></marker></defs><rect width="1800" height="1030" fill="white"/><rect x="550" y="20" width="700" height="80" fill="white" stroke="#111" stroke-width="2"/><text x="900" y="69.24" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" >FURPS+ · функциональность</text><path d="M900 100L900 130L900 130L900 170" fill="none" stroke="#111" stroke-width="2"  /><rect x="20" y="170" width="1760" height="80" fill="white" stroke="#111" stroke-width="2"/><text x="900" y="218.58" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" >Функциональность</text><path d="M900 250L900 310L10 310L10 442.5L20 442.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="20" y="350" width="405" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="222.5" y="393.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >F-01</text><text x="222.5" y="422" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >Импортировать компоненты,</text><text x="222.5" y="450.75" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >цены и остатки с датой</text><text x="222.5" y="479.5" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >источника; отклонять</text><text x="222.5" y="508.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >некорректные строки.</text><path d="M900 250L900 310L455 310L455 442.5L465 442.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="465" y="350" width="405" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="667.5" y="378.875" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >F-02</text><text x="667.5" y="407.625" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >Хранить черновые и</text><text x="667.5" y="436.375" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >согласованные версии</text><text x="667.5" y="465.125" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >модельного ряда; не изменять</text><text x="667.5" y="493.875" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >согласованную версию на</text><text x="667.5" y="522.625" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >месте.</text><path d="M900 250L900 310L900 310L900 442.5L910 442.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="910" y="350" width="405" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="1112.5" y="393.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >F-03</text><text x="1112.5" y="422" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >Проверять совместимость по</text><text x="1112.5" y="450.75" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >утверждённым правилам и</text><text x="1112.5" y="479.5" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >блокировать согласование при</text><text x="1112.5" y="508.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >критической ошибке.</text><path d="M900 250L900 310L1345 310L1345 442.5L1355 442.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="1355" y="350" width="405" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="1557.5" y="393.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >F-04</text><text x="1557.5" y="422" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >Показывать зависимые</text><text x="1557.5" y="450.75" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >модельные ряды и карточки при</text><text x="1557.5" y="479.5" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >изменении компонента, цены</text><text x="1557.5" y="508.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >или изображения.</text><path d="M900 250L900 310L10 310L10 662.5L20 662.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="20" y="570" width="405" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="222.5" y="613.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >F-05</text><text x="222.5" y="642" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >Рассчитывать себестоимость,</text><text x="222.5" y="670.75" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >цену и массу по версии</text><text x="222.5" y="699.5" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >модельного ряда и снимку</text><text x="222.5" y="728.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >исходных значений.</text><path d="M900 250L900 310L455 310L455 662.5L465 662.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="465" y="570" width="405" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="667.5" y="627.625" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >F-06</text><text x="667.5" y="656.375" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >Связывать изображения с</text><text x="667.5" y="685.125" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >конфигурацией и отмечать</text><text x="667.5" y="713.875" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >необходимость их пересмотра.</text><path d="M900 250L900 310L900 310L900 662.5L910 662.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="910" y="570" width="405" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="1112.5" y="613.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >F-07</text><text x="1112.5" y="642" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >Формировать карточку по</text><text x="1112.5" y="670.75" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >шаблону категории, проверять</text><text x="1112.5" y="699.5" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >обязательные поля до</text><text x="1112.5" y="728.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >передачи.</text><path d="M900 250L900 310L1345 310L1345 662.5L1355 662.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="1355" y="570" width="405" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="1557.5" y="627.625" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >F-08</text><text x="1557.5" y="656.375" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >Передавать утверждённый</text><text x="1557.5" y="685.125" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >пакет и сохранять отдельную</text><text x="1557.5" y="713.875" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >попытку публикации.</text><path d="M900 250L900 310L10 310L10 882.5L20 882.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="20" y="790" width="405" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="222.5" y="833.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >F-09</text><text x="222.5" y="862" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >Учитывать ожидание, успех,</text><text x="222.5" y="890.75" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >отказ и неопределённый</text><text x="222.5" y="919.5" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >результат; контролировать</text><text x="222.5" y="948.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >повторные операции.</text><path d="M900 250L900 310L455 310L455 882.5L465 882.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="465" y="790" width="405" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="667.5" y="847.625" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >F-10</text><text x="667.5" y="876.375" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >Сохранять историю значимых</text><text x="667.5" y="905.125" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >изменений и действий</text><text x="667.5" y="933.875" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >пользователей.</text><path d="M900 250L900 310L900 310L900 882.5L910 882.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="910" y="790" width="405" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="1112.5" y="847.625" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >F-11</text><text x="1112.5" y="876.375" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >Формировать реестр карточек и</text><text x="1112.5" y="905.125" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >отчёт по срокам, ошибкам и</text><text x="1112.5" y="933.875" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >актуальности.</text><path d="M900 250L900 310L1345 310L1345 882.5L1355 882.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="1355" y="790" width="405" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="1557.5" y="833.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >F-12</text><text x="1557.5" y="862" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >Разграничивать доступ</text><text x="1557.5" y="890.75" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >менеджера, производства,</text><text x="1557.5" y="919.5" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >дизайнера, директора и</text><text x="1557.5" y="948.25" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" >администратора.</text></svg>