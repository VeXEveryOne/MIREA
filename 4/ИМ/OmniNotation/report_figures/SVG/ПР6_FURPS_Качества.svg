idth="350" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="930" y="236.08" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" >Производительность</text><path d="M930 285L930 310L747 310L747 457.5L755 457.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="755" y="365" width="350" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="930" y="410.22" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >P-01</text><text x="930" y="437.82" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >95-й процентиль открытия</text><text x="930" y="465.42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >карточки ≤ 2 с при 5</text><text x="930" y="493.02000000000004" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >одновременных</text><text x="930" y="520.62" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >пользователях.</text><path d="M930 285L930 310L747 310L747 672.5L755 672.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="755" y="580" width="350" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="930" y="652.8199999999999" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >P-02</text><text x="930" y="680.42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >проверка одного модельного</text><text x="930" y="708.02" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >ряда до 30 строк ≤ 3 с.</text><path d="M930 285L930 310L747 310L747 887.5L755 887.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="755" y="795" width="350" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="930" y="867.8199999999999" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >P-03</text><text x="930" y="895.42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >импорт 10 000 строк ≤ 5 мин</text><text x="930" y="923.02" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >без потери записей.</text><path d="M900 100L900 130L1300 130L1300 170" fill="none" stroke="#111" stroke-width="2"  /><rect x="1125" y="170" width="350" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="1300" y="236.08" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" >Сопровождаемость</text><path d="M1300 285L1300 310L1117 310L1117 457.5L1125 457.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="1125" y="365" width="350" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="1300" y="424.02000000000004" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >S-01</text><text x="1300" y="451.62" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >правила совместимости и</text><text x="1300" y="479.22" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >шаблоны изменяются без</text><text x="1300" y="506.82" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >правки исходного кода.</text><path d="M1300 285L1300 310L1117 310L1117 672.5L1125 672.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="1125" y="580" width="350" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="1300" y="652.8199999999999" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >S-02</text><text x="1300" y="680.42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >интеграция отделена от</text><text x="1300" y="708.02" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >предметных расчётов.</text><path d="M1300 285L1300 310L1117 310L1117 887.5L1125 887.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="1125" y="795" width="350" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="1300" y="854.02" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >S-03</text><text x="1300" y="881.62" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >поставка содержит</text><text x="1300" y="909.2199999999999" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >инструкцию развёртывания,</text><text x="1300" y="936.8199999999999" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >миграции и восстановления.</text><path d="M900 100L900 130L1670 130L1670 170" fill="none" stroke="#111" stroke-width="2"  /><rect x="1495" y="170" width="350" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="1670" y="221.13000000000002" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" >Дополнительные</text><text x="1670" y="251.03" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" >ограничения</text><path d="M1670 285L1670 310L1487 310L1487 457.5L1495 457.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="1495" y="365" width="350" height="185" fill="white" stroke="#111" stroke-width="2"/><text x="1670" y="410.22" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >X-01</text><text x="1670" y="437.82" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >браузерный доступ в</text><text x="1670" y="465.42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >локальной сети; внешние</text><text x="1670" y="493.02000000000004" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >подключения по</text><text x="1670" y="520.62" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" >защищённому каналу.</text><path d="M1670 285L1670 310L1487 310L1487 672.5L1495 672.5" fill="none" stroke="#111" stroke-width="2"  /><rect x="1495" y="580" width="350" height="185" fill=