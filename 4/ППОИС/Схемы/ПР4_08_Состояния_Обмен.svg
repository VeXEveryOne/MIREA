><text x="220" y="174.5" text-anchor="middle" font-size="23" fill="#111">Отправляется</text><rect x="640" y="110" width="320" height="110" rx="15" fill="white" stroke="#111" stroke-width="2"/><text x="800" y="160" text-anchor="middle" font-size="23" fill="#111">Ожидает</text><text x="800" y="189" text-anchor="middle" font-size="23" fill="#111">результата</text><rect x="1220" y="110" width="320" height="110" rx="15" fill="white" stroke="#111" stroke-width="2"/><text x="1380" y="174.5" text-anchor="middle" font-size="23" fill="#111">Опубликована</text><rect x="60" y="610" width="320" height="110" rx="15" fill="white" stroke="#111" stroke-width="2"/><text x="220" y="674.5" text-anchor="middle" font-size="23" fill="#111">Временная ошибка</text><rect x="640" y="610" width="320" height="110" rx="15" fill="white" stroke="#111" stroke-width="2"/><text x="800" y="660" text-anchor="middle" font-size="23" fill="#111">Результат</text><text x="800" y="689" text-anchor="middle" font-size="23" fill="#111">неизвестен</text><rect x="1220" y="610" width="320" height="110" rx="15" fill="white" stroke="#111" stroke-width="2"/><text x="1380" y="674.5" text-anchor="middle" font-size="23" fill="#111">Отказ</text><text x="800" y="810" text-anchor="middle" font-size="21" fill="#111">T17: после исправления отказа — новый черновик (рисунок 7).</text><text x="800" y="860" text-anchor="middle" font-size="21" fill="#111">При неизвестном исходе повторная отправка запрещена до сверки.</text><text x="800" y="910" text-anchor="middle" font-size="21" fill="#111">Приём задачи — не подтверждение публикации. Повторы ограничены, с задержкой.</text></g></svg>