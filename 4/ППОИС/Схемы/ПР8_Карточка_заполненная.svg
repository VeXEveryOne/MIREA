ом и видеосвязи.</tspan><tspan x="290" dy="30.5">Платформа AM5, двухканальная память DDR5, твердотельный накопитель M.2. Комплект:</tspan><tspan x="290" dy="30.5">системный блок и кабель питания. Монитор и периферия приобретаются отдельно.</tspan></text><rect x="290" y="1270" width="430" height="60" rx="7" fill="#e1ebf2" stroke="#151515" stroke-width="2"/><text x="505" y="1308" text-anchor="middle" font-size="25" font-weight="bold"><tspan x="505" dy="0">Передать на публикацию</tspan></text></g></svg>
