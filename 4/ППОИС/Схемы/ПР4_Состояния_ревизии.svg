<svg xmlns="http://www.w3.org/2000/svg" width="1690" height="1110" viewBox="0 0 1690 1110"><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1 1 L10 5 L1 9" fill="none" stroke="#111" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="20" markerHeight="12" refX="1" refY="6" orient="auto"><path d="M1 6 L9 1 L17 6 L9 11 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#111"><rect x="45" y="110" width="710" height="290" rx="20" fill="white" stroke="#151515" stroke-width="2"/><text x="400" y="152" text-anchor="middle" font-size="30" font-weight="bold"><tspan x="400" dy="0">Черновик / DRAFT</tspan></text><path d="M45,175 L755,175" fill="none" stroke="white" stroke-width="9"/><path d="M45,175 L755,175" fill="none" stroke="#151515" stroke-width="2.3"   /><text x="67" y="220" text-anchor="start" font-size="26" ><tspan x="67" dy="0">entry / открыть черновик</tspan></text><text x="67" y="272" text-anchor="start" font-size="26" ><tspan x="67" dy="0">do / редактировать содержание</tspan></text><text x="67" y="324" text-anchor="start" font-size="26" ><tspan x="67" dy="0">exit / проверить заполнение</tspan></text><rect x="925" y="110" width="710" height="290" rx="20" fill="white" stroke="#151515" stroke-width="2"/><text x="1280" y="152" text-anchor="middle" font-size="30" font-weight="bold"><tspan x="1280" dy="0">Проверка готовности</tspan></text><path d="M925,175 L1635,175" fill="none" stroke="white" stroke-width="9"/><path d="M925,175 L1635,175" fill="none" stroke="#151515" stroke-width="2.3"   /><text x="947" y="220" text-anchor="start" font-size="26" ><tspan x="947" dy="0">entry / загрузить состав и изображения</tspan></text><text x="947" y="272" text-anchor="start" font-size="26" ><tspan x="947" dy="0">do / проверить цену и обязательные поля</tspan></text><text x="947" y="324" text-anchor="start" font-size="26" ><tspan x="947" dy="0">exit / сохранить результат проверки</tspan></text><rect x="925" y="660" width="710" height="290" rx="20" fill="white" stroke="#151515" stroke-width="2"/><text x="1280" y="702" text-anchor="middle" font-size="30" font-weight="bold"><tspan x="1280" dy="0">Готова / READY</tspan></text><path d="M925,725 L1635,725" fill="none" stroke="white" stroke-width="9"/><path d="M925,725 L1635,725" fill="none" stroke="#151515" stroke-width="2.3"   /><text x="947" y="770" text-anchor="start" font-size="26" ><tspan x="947" dy="0">entry / зафиксировать утверждение</tspan></text><text x="947" y="822" text-anchor="start" font-size="26" ><tspan x="947" dy="0">do / ожидать передачи на публикацию</tspan></text><text x="947" y="874" text-anchor="start" font-size="26" ><tspan x="947" dy="0">exit / проверить актуальность состава</tspan></text><rect x="45" y="660" width="710" height="290" rx="20" fill="white" stroke="#151515" stroke-width="2"/><text x="400" y="702" text-anchor="middle" font-size="30" font-weight="bold"><tspan x="400" dy="0">Требует актуализации / STALE</tspan></text><path d="M45,725 L755,725" fill="none" stroke="white" stroke-width="9"/><path d="M45,725 L755,725" fill="none" stroke="#151515" stroke-width="2.3"   /><text x="67" y="770" text-anchor="start" font-size="26" ><tspan x="67" dy="0">entry / отметить изменение исходных данных</tspan></text><text x="67" y="822" text-anchor="start" font-size="26" ><tspan x="67" dy="0">do / ожидать новой ревизии</tspan></text><circle cx="75" cy="45" r="12" fill="#111"/><path d="M75,58 L75,110" fill="none" stroke="white" stroke-width="9"/><path d="M75,58 L75,110" fill="none" stroke="#151515" stroke-width="2.3"  marker-end="url(#arrow)" /><path d="M400,110 L400,65 L1280,65 L1280,110" fill="none" stroke="white" stroke-width="9"/><path d="M400,110 L400,65 L1280,65 L1280,110" fill="none" stroke="#151515" stroke-width="2.3"  marker-end="url(#arrow)" /><rect x="704" y="16" width="272" height="29" rx="0" fill="white" stroke="white" stroke-width="2"/><text x="840" y="40" text-anchor="middle" font-size="23" ><tspan x="840" dy="0">запросить утверждение</tspan></text><path d="M925,345 L835,345 L835,485 L410,485 L410,400" fill="none" stroke="white" stroke-width="9"/><path d="M925,345 L835,345 L835,485 L410,485 L410,400" fill="none" stroke="#151515" stroke-width="2.3"  marker-end="url(#arrow)" /><rect x="326" y="441" width="428" height="29" rx="0" fill="white" stroke="white" stroke-width="2"/><text x="540" y="465" text-anchor="middle" font-size="23" ><tspan x="540" dy="0">[есть ошибки] / показать замечания</tspan></text><path d="M1280,400 L1280,660" fill="none" stroke="white" stroke-width="9"/><path d="M1280,400 L1280,660" fill="none" stroke="#151515" stroke-width="2.3"  marker-end="url(#arrow)" /><rect x="1074" y="501" width="392" height="29" rx="0" fill="white" stroke="white" stroke-width="2"/><text x="1270" y="525" text-anchor="middle" font-size="23" ><tspan x="1270" dy="0">[проверки пройдены] / утвердить</tspan></text><path d="M925,790 L755,790" fill="none" stroke="white" stroke-width="9"/><path d="M925,790 L755,790" fill="none" stroke="#151515" stroke-width="2.3"  marker-end="url(#arrow)" /><rect x="788" y="771" width="104" height="58" rx="0" fill="white" stroke="white" stroke-width="2"/><text x="840" y="795" text-anchor="middle" font-size="23" ><tspan x="840" dy="0">изменён</tspan><tspan x="840" dy="28.06">состав</tspan></text><text x="850" y="1040" text-anchor="middle" font-size="25" ><tspan x="850" dy="0">Объект — ревизия карточки. Новая ревизия начинает собственный цикл с DRAFT.</tspan></text></g></svg>
