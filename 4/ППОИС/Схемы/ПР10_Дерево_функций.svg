<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1130" viewBox="0 0 1780 1130"><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1 1 L10 5 L1 9" fill="none" stroke="#111" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="20" markerHeight="12" refX="1" refY="6" orient="auto"><path d="M1 6 L9 1 L17 6 L9 11 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#111"><rect x="670" y="20" width="440" height="90" rx="12" fill="white" stroke="#151515" stroke-width="2"/><text x="890" y="58" text-anchor="middle" font-size="29" font-weight="bold"><tspan x="890" dy="0">Функции ИС</tspan></text><rect x="60" y="190" width="1190" height="90" rx="12" fill="white" stroke="#151515" stroke-width="2"/><text x="655" y="228" text-anchor="middle" font-size="29" font-weight="bold"><tspan x="655" dy="0">Основные функции</tspan></text><rect x="1310" y="190" width="410" height="90" rx="12" fill="white" stroke="#151515" stroke-width="2"/><text x="1515" y="228" text-anchor="middle" font-size="29" font-weight="bold"><tspan x="1515" dy="0">Служебные функции</tspan></text><path d="M890,110 L890,150 L655,150 L655,190" fill="none" stroke="white" stroke-width="9"/><path d="M890,110 L890,150 L655,150 L655,190" fill="none" stroke="#151515" stroke-width="2.3"   /><path d="M890,150 L1515,150 L1515,190" fill="none" stroke="white" stroke-width="9"/><path d="M890,150 L1515,150 L1515,190" fill="none" stroke="#151515" stroke-width="2.3"   /><path d="M655,280 L655,310 L30,310 L30,930" fill="none" stroke="white" stroke-width="9"/><path d="M655,280 L655,310 L30,310 L30,930" fill="none" stroke="#151515" stroke-width="2.3"   /><path d="M30,390 L60,390" fill="none" stroke="white" stroke-width="9"/><path d="M30,390 L60,390" fill="none" stroke="#151515" stroke-width="2.3"   /><rect x="60" y="340" width="400" height="100" rx="12" fill="white" stroke="#151515" stroke-width="2"/><text x="260" y="378" text-anchor="middle" font-size="29" font-weight="bold"><tspan x="260" dy="0">Менеджер</tspan></text><rect x="510" y="340" width="740" height="150" rx="0" fill="white" stroke="#151515" stroke-width="2"/><text x="535" y="376" text-anchor="start" font-size="26" ><tspan x="535" dy="0">Зарегистрировать карточку; Рассчитать цену и</tspan><tspan x="535" dy="31.72">массу; Сохранить ревизию; Опубликовать карточку</tspan></text><path d="M460,390 L510,390" fill="none" stroke="white" stroke-width="9"/><path d="M460,390 L510,390" fill="none" stroke="#151515" stroke-width="2.3"   /><path d="M30,570 L60,570" fill="none" stroke="white" stroke-width="9"/><path d="M30,570 L60,570" fill="none" stroke="#151515" stroke-width="2.3"   /><rect x="60" y="520" width="400" height="100" rx="12" fill="white" stroke="#151515" stroke-width="2"/><text x="260" y="558" text-anchor="middle" font-size="29" font-weight="bold"><tspan x="260" dy="0">Генеральный</tspan><tspan x="260" dy="35.38">директор</tspan></text><rect x="510" y="520" width="740" height="150" rx="0" fill="white" stroke="#151515" stroke-width="2"/><text x="535" y="556" text-anchor="start" font-size="26" ><tspan x="535" dy="0">Просмотреть сводку карточек; Проверить цену и</tspan><tspan x="535" dy="31.72">состав; Утвердить готовую ревизию</tspan></text><path d="M460,570 L510,570" fill="none" stroke="white" stroke-width="9"/><path d="M460,570 L510,570" fill="none" stroke="#151515" stroke-width="2.3"   /><path d="M30,750 L60,750" fill="none" stroke="white" stroke-width="9"/><path d="M30,750 L60,750" fill="none" stroke="#151515" stroke-width="2.3"   /><rect x="60" y="700" width="400" height="100" rx="12" fill="white" stroke="#151515" stroke-width="2"/><text x="260" y="738" text-anchor="middle" font-size="29" font-weight="bold"><tspan x="260" dy="0">Разработчик</tspan></text><rect x="510" y="700" width="740" height="150" rx="0" fill="white" stroke="#151515" stroke-width="2"/><text x="535" y="736" text-anchor="start" font-size="26" ><tspan x="535" dy="0">Просмотреть каталог и предложения; Сформировать</tspan><tspan x="535" dy="31.72">состав; Проверить совместимость; Сохранить</tspan><tspan x="535" dy="31.72">версию состава</tspan></text><path d="M460,750 L510,750" fill="none" stroke="white" stroke-width="9"/><path d="M460,750 L510,750" fill="none" stroke="#151515" stroke-width="2.3"   /><path d="M30,930 L60,930" fill="none" stroke="white" stroke-width="9"/><path d="M30,930 L60,930" fill="none" stroke="#151515" stroke-width="2.3"   /><rect x="60" y="880" width="400" height="100" rx="12" fill="white" stroke="#151515" stroke-width="2"/><text x="260" y="918" text-anchor="middle" font-size="29" font-weight="bold"><tspan x="260" dy="0">Дизайнер</tspan></text><rect x="510" y="880" width="740" height="150" rx="0" fill="white" stroke="#151515" stroke-width="2"/><text x="535" y="916" text-anchor="start" font-size="26" ><tspan x="535" dy="0">Открыть задание по карточке; Выбрать</tspan><tspan x="535" dy="31.72">изображение; Назначить порядок изображений;</tspan><tspan x="535" dy="31.72">Просмотреть результат оформления</tspan></text><path d="M460,930 L510,930" fill="none" stroke="white" stroke-width="9"/><path d="M460,930 L510,930" fill="none" stroke="#151515" stroke-width="2.3"   /><rect x="1310" y="340" width="410" height="420" rx="0" fill="white" stroke="#151515" stroke-width="2"/><text x="1335" y="390" text-anchor="start" font-size="28" ><tspan x="1335" dy="0">Вход и выход</tspan><tspan x="1335" dy="34.16">Проверка прав</tspan><tspan x="1335" dy="34.16">Проверка ввода</tspan><tspan x="1335" dy="34.16">Сообщения об ошибках</tspan><tspan x="1335" dy="34.16">Справка</tspan><tspan x="1335" dy="34.16">Диагностика</tspan></text><path d="M1515,280 L1515,340" fill="none" stroke="white" stroke-width="9"/><path d="M1515,280 L1515,340" fill="none" stroke="#151515" stroke-width="2.3"   /></g></svg>
